<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小跟拍戰情版</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0f2f5; --card: #fff; --primary: #4f46e5; --primary-hover: #4338ca;
  --text: #1e293b; --text2: #64748b; --border: #e2e8f0;
  --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
  --sidebar-bg: #1e1b4b; --sidebar-hover: #312e81; --sidebar-active: #4f46e5;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.12);
  --sidebar-w: 220px;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; }

.sidebar { width: var(--sidebar-w); background: var(--sidebar-bg); color: #c7d2fe; position: fixed; top: 0; left: 0; bottom: 0; padding: 24px 0; z-index: 100; display: flex; flex-direction: column; }
.sidebar-title { padding: 0 12px 16px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 8px; cursor: pointer; display: block; text-decoration: none; }
.sidebar-title img { width: 100%; max-width: 180px; height: auto; display: block; }
.sidebar-nav { list-style: none; flex: 1; }
.sidebar-nav li { margin: 2px 8px; }
.sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; color: #c7d2fe; text-decoration: none; font-size: 14px; font-weight: 500; transition: all .15s; cursor: pointer; }
.sidebar-nav a:hover { background: var(--sidebar-hover); color: #fff; }
.sidebar-nav a.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
.sidebar-nav .nav-icon { font-size: 18px; width: 24px; text-align: center; }

.main-content { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; }

.header { background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 19px; font-weight: 700; }
.header-right { display: flex; gap: 8px; flex-wrap: wrap; }

.revenue-bar { background: var(--card); margin: 16px 24px 0; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.rev-block { text-align: center; }
.rev-block .rev-label { font-size: 11px; color: var(--text2); margin-bottom: 2px; }
.rev-block .rev-value { font-size: 20px; font-weight: 700; }
.rev-progress-wrap { flex: 1; min-width: 180px; }
.rev-progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 5px; }
.rev-progress-outer { position: relative; }
.rev-progress-bar { height: 14px; background: #e2e8f0; border-radius: 7px; overflow: hidden; }
.rev-progress-fill { height: 100%; border-radius: 7px; background: linear-gradient(90deg, var(--primary), #7c3aed); transition: width .5s ease; }
.rev-checkpoints { position: relative; height: 16px; margin-top: 2px; }
.rev-cp { position: absolute; transform: translateX(-50%); font-size: 9px; font-weight: 500; color: #cbd5e1; transition: color .3s; }
.rev-cp.reached { color: var(--primary); font-weight: 700; }
.rev-pct { font-size: 20px; font-weight: 700; color: var(--primary); min-width: 55px; text-align: center; }

.btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-white { background: #fff; color: var(--primary); }
.btn-white:hover { background: #f1f0ff; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 7px 10px; font-size: 16px; line-height: 1; }
.btn-success { background: var(--success); color: #fff; }

.page { display: none; }
.page.active { display: block; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; padding: 16px 24px; }
.stat-card { background: var(--card); border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow); }
.stat-card .label { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
.stat-card .value { font-size: 24px; font-weight: 700; }
.stat-card .value.blue { color: var(--info); }
.stat-card .value.yellow { color: var(--warning); }
.stat-card .value.green { color: var(--success); }
.stat-card .value.red { color: var(--danger); }

.toolbar { display: flex; gap: 8px; padding: 0 24px 12px; flex-wrap: wrap; align-items: center; }
.search-box { flex: 0 1 240px; min-width: 120px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--card); outline: none; }
.search-box:focus { border-color: var(--primary); }

.ms-wrap { position: relative; }
.ms-btn { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--card); cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; user-select: none; }
.ms-btn:hover { border-color: var(--primary); }
.ms-btn .ms-count { background: var(--primary); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 10px; }
.ms-drop { display: none; position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-lg); z-index: 500; min-width: 180px; max-height: 260px; overflow-y: auto; padding: 6px 0; }
.ms-drop.open { display: block; }
.ms-drop label { display: flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.ms-drop label:hover { background: var(--bg); }
.ms-drop input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary); }
.ms-drop .ms-all { border-bottom: 1px solid var(--border); margin-bottom: 4px; padding-bottom: 8px; font-weight: 600; color: var(--primary); }

.table-wrapper { padding: 0 24px 24px; }
.table-wrapper .table-scroll-hint { display: none; }
.table-container { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 800px; }
thead th { text-align: left; padding: 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--text2); background: #f8fafc; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
thead th:hover { color: var(--primary); }
thead th.sorted-asc::after { content: " ▲"; font-size: 9px; }
thead th.sorted-desc::after { content: " ▼"; font-size: 9px; }
tbody td { padding: 7px 6px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
tbody tr:hover { background: #f8fafc; }
tbody tr:last-child td { border-bottom: none; }

/* 狀態橫向顯示，避免直書 */
.ms-btn, thead th, .status-pipeline-wrap, .status-pipeline { writing-mode: horizontal-tb; text-orientation: mixed; white-space: nowrap; }
.status-badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.status-待分配 { background: #fef3c7; color: #92400e; }
.status-剪輯中 { background: #dbeafe; color: #1e40af; }
.status-初稿修改中 { background: #ffedd5; color: #9a3412; }
.status-客戶確認中 { background: #ede9fe; color: #5b21b6; }
.status-已完成, .status-客戶確認完成 { background: #d1fae5; color: #065f46; }
.status-已上傳雲端 { background: #cffafe; color: #155e75; }
.status-已上傳影片 { background: #f0fdf4; color: #14532d; }
/* 五階段圓圈：準備、初剪、優化、排程、上片；文字在圓圈下方，右側顯示狀態 */
.status-pipeline-wrap { display: inline-flex; align-items: flex-start; gap: 10px; flex-wrap: nowrap; }
.status-pipeline { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.status-pipeline .steps-row { display: flex; align-items: center; gap: 0; }
.status-pipeline .step { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #e2e8f0; background: #f8fafc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 0; }
.status-pipeline .step.active { background: #3b82f6; border-color: #3b82f6; }
.status-pipeline .step.active.step-upload { background: #22c55e; border-color: #22c55e; }
.status-pipeline .conn { width: 10px; height: 2px; background: #e2e8f0; flex-shrink: 0; }
.status-pipeline .conn.active { background: #3b82f6; }
.status-pipeline .conn.active-upload { background: #22c55e; }
.status-pipeline .labels-row { display: flex; gap: 10px; width: 150px; font-size: 9px; color: var(--text2); line-height: 1.2; }
.status-pipeline .labels-row span { flex: 0 0 22px; text-align: center; }
.status-pipeline-wrap .status-badge { flex-shrink: 0; margin-left: 4px; }
.overdue-tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--danger); color: #fff; margin-right: 6px; }
.note-cell { max-width: 130px; }
.note-cell span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; gap: 4px; white-space: nowrap; }
.empty-state { text-align: center; padding: 50px 20px; color: var(--text2); }
.empty-state .icon { font-size: 40px; margin-bottom: 8px; }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; justify-content: center; align-items: flex-start; padding: 28px 14px; overflow-y: auto; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 620px; animation: slideUp .25s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.modal-header h2 { font-size: 15px; font-weight: 700; }
.modal-close { width: 28px; height: 28px; border: none; background: var(--bg); border-radius: 6px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); }
.modal-close:hover { background: #e2e8f0; }
.modal-body { padding: 16px 20px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }

.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.form-group label .required { color: var(--danger); margin-left: 2px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input-with-add { display: flex; gap: 6px; }
.input-with-add select, .input-with-add input { flex: 1; }

input[type="text"], input[type="url"], input[type="date"], input[type="number"], select, textarea {
  width: 100%; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; transition: border .2s; background: #fff;
}
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 50px; }

.confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1100; justify-content: center; align-items: center; }
.confirm-overlay.active { display: flex; }
.confirm-box { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 24px; text-align: center; max-width: 360px; width: 90%; animation: slideUp .2s ease; }
.confirm-box p { margin-bottom: 16px; font-size: 14px; }
.confirm-actions { display: flex; gap: 8px; justify-content: center; }

.detail-grid { display: grid; grid-template-columns: 100px 1fr; gap: 8px 12px; font-size: 13px; }
.detail-label { font-weight: 600; color: var(--text2); }
.detail-value { word-break: break-word; }
.detail-value a { color: var(--primary); text-decoration: none; }
.detail-value a:hover { text-decoration: underline; }

.toast-container { position: fixed; top: 18px; right: 18px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; }
.toast { background: var(--card); padding: 11px 16px; border-radius: 8px; box-shadow: var(--shadow-lg); font-size: 13px; animation: slideIn .3s ease; border-left: 4px solid var(--success); }
.toast.error { border-left-color: var(--danger); }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

.profile-grid { padding: 16px 32px 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.profile-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; overflow: hidden; }
.profile-card.client-card-clickable { cursor: pointer; }
.profile-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
.profile-card h3 > span:first-child { min-width: 0; flex: 1 1 auto; word-break: break-word; }
.profile-card h3 .client-budget-wrap { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
.client-budget-input { width: 52px; font-size: 12px; color: var(--text2); padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px; }
.client-budget-input:focus { border-color: var(--primary); color: var(--text); outline: none; }
.profile-card h3 .client-budget-unit { font-size: 12px; font-weight: 400; color: var(--text2); white-space: nowrap; }
.profile-card h3 .client-delete-btn { flex-shrink: 0; }
.profile-card h3 .client-h3-right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
.client-stats-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 12px; }
.client-stats-row .client-stat-item { display: flex; flex-direction: column; gap: 2px; }
.client-stats-row .client-stat-val { font-size: 18px; font-weight: 700; }
.client-stats-row .client-stat-val.primary { color: var(--primary); }
.client-stats-row .client-stat-val.success { color: var(--success); }
.client-stats-row .client-detail-btn { margin-left: auto; }
.profile-field { margin-bottom: 12px; }
.profile-field label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px; }
.profile-field input, .profile-field select, .profile-field textarea { font-size: 13px; padding: 7px 10px; }
.profile-field textarea { min-height: 44px; }
.profile-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-table-wrap { overflow-x: auto; margin-top: 6px; }
.profile-mini-table { width: 100%; font-size: 12px; border-collapse: collapse; table-layout: auto; min-width: 0; }
.profile-mini-table th { text-align: left; padding: 5px 6px; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text2); white-space: nowrap; }
.profile-mini-table td { padding: 5px 6px; border-bottom: 1px solid var(--border); word-break: break-word; max-width: 120px; }
.profile-mini-table td:last-child { white-space: nowrap; }
.profile-mini-table input { padding: 4px 6px; font-size: 12px; width: 70px; }
.profile-mini-table input.view-count-input { color: var(--text2); }
.btn-link { background: none; border: none; padding: 0; font-size: inherit; color: var(--primary); cursor: pointer; text-decoration: underline; }
.btn-link:hover { color: var(--primary-hover); }
.vpv-row { display: grid; grid-template-columns: 1fr 120px 80px 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
.vpv-row input, .vpv-row select { padding: 6px 8px; font-size: 13px; }

.work-status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.ws-開工 { background: #d1fae5; color: #065f46; }
.ws-暫時休息 { background: #fef3c7; color: #92400e; }
.ws-暫停 { background: #fee2e2; color: #991b1b; }

.cb-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.cb-grid label { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 8px; background: var(--bg); border-radius: 6px; cursor: pointer; }
.cb-grid input { width: 14px; height: 14px; accent-color: var(--primary); }

.page-title { font-size: 18px; font-weight: 700; padding: 20px 32px 8px; }

/* Didi section blocks */
.didi-section { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin: 16px 32px; padding: 20px 24px; }
.didi-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.didi-table-wrap { overflow-x: auto; }
.didi-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px; }
.didi-table th { text-align: left; padding: 8px 8px; background: #f8fafc; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text2); white-space: nowrap; }
.didi-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
.didi-table input, .didi-table select, .didi-table textarea { font-size: 12px; padding: 5px 7px; }
.didi-table textarea { min-height: 32px; resize: vertical; }
.didi-subtotal { margin-top: 10px; text-align: right; font-size: 14px; font-weight: 700; color: var(--primary); }

/* Mobile card layout for didi sections */
.didi-cards { display: none; }
.didi-card { background: #f8fafc; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); }
.didi-card-field { margin-bottom: 10px; }
.didi-card-field:last-of-type { margin-bottom: 0; }
.didi-card-field label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 3px; }
.didi-card-field input, .didi-card-field select, .didi-card-field textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; box-sizing: border-box; }
.didi-card-actions { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
@media (min-width: 769px) {
  .didi-cards { display: none !important; }
  .didi-table-wrap { display: block !important; }
}
@media (max-width: 768px) {
  .didi-table-wrap { display: none !important; }
  .didi-cards { display: block !important; }
}
.didi-compact-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #f8fafc; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
.didi-compact-row .dm-title { flex: 1; min-width: 0; font-weight: 500; }
.didi-compact-row .dm-num { font-size: 13px; color: var(--text2); white-space: nowrap; }
.didi-compact-row .dm-fee { font-weight: 600; color: var(--primary); white-space: nowrap; }
.didi-compact-row .dm-actions { display: flex; gap: 4px; margin-left: auto; }
@media (min-width: 769px) {
  .didi-media-compact, .didi-speech-compact, .didi-software-compact { display: none !important; }
}
@media (max-width: 768px) {
  .didi-media-compact { display: block !important; }
  .didi-media-table-cards { display: none !important; }
  .didi-speech-compact { display: block !important; }
  .didi-speech-table-cards { display: none !important; }
  .didi-software-compact { display: block !important; }
  .didi-software-table-cards { display: none !important; }
  .didi-table .didi-sw-start-date { display: none !important; }
}

/* ── Mobile-only elements ── */
.bottom-nav { display: none; }

@media (max-width: 900px) {
  .sidebar { width: 56px; }
  .sidebar-title { display: none; }
  .sidebar-nav span { display: none; }
  .sidebar-nav a { justify-content: center; padding: 12px; }
  .main-content { margin-left: 56px; }
  .header, .stats, .toolbar, .table-wrapper, .revenue-bar, .profile-grid, .page-title, .didi-section { padding-left: 14px; padding-right: 14px; margin-left: 0; margin-right: 0; }
  .revenue-bar { margin: 10px 14px 0; }
  .form-row, .profile-row { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .profile-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main-content { margin-left: 0; padding-bottom: 68px; max-width: 100vw; overflow-x: hidden; }
  html, body { overflow-x: hidden; }

  /* Compact header on mobile */
  .header { padding: 10px 14px; max-width: 100%; }
  .header h1 { font-size: 15px; }
  .header-right { gap: 4px; flex-wrap: wrap; max-width: 100%; }
  .header-right .btn { padding: 5px 8px; font-size: 10px; }

  .revenue-bar { flex-direction: column; gap: 8px; padding: 12px; margin: 0 10px; align-items: stretch; border-radius: 10px; max-width: 100%; }
  .rev-block { text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .rev-block .rev-label { font-size: 12px; margin-bottom: 0; }
  .rev-block .rev-value { font-size: 15px !important; }
  .rev-progress-wrap { min-width: 0; }
  .rev-pct { font-size: 16px; min-width: auto; text-align: right; }

  /* Bottom nav */
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--sidebar-bg); z-index: 100;
    justify-content: space-around; align-items: stretch;

            <label>客戶名稱 <span class="required">*</span></label>

          </div>

            <label>狀態 <span class="required">*</span></label>

<script>
const DONE_STATUSES = ['初稿修改中','客戶確認中','已完成','已上傳雲端','已上傳影片'];
const FINISHED_STATUSES = ['已上傳影片'];
const ALL_STATUSES = ['待分配','剪輯中','初稿修改中','客戶確認中','已完成','已上傳雲端','已上傳影片'];
const DEFAULT_CLIENTS = ['大可為','JGB','婕絲','台中市政府數位發展局','吃喝玩樂','多德仕','和居','恩友友','萬華街區','橙果創意','底迪'];
const DEFAULT_EDITORS = ['李宥儀','邱麟晴','翁薏惠','陳思妤','高偉翔','楊淳惠','楊斯涵','王彥鈞','賴宇柔','李依珊','顏佳祐','賴彥辰','黃睿妤','劉恩伶','鄭樺薇','胡禎妮','郭佳柔','王晨羽'];

const CLIENT_PRICES = {'大可為':4000,'JGB':2500,'婕絲':2500,'台中市政府數位發展局':10000,'吃喝玩樂':4000,'多德仕':4000,'和居':10000,'恩友友':10000,'萬華街區':0,'橙果創意':-1,'底迪':0};
const PLATFORM_OPTIONS = ['IG','Threads','Tiktok','FB','Line Voom','Youtube'];
const REVENUE_TARGET = 5000000;

const LS_VIDEOS='vd_videos', LS_CLIENTS='vd_clients', LS_EDITORS='vd_editors';
const LS_CLIENT_PROFILES='vd_client_profiles', LS_EDITOR_PROFILES='vd_editor_profiles', LS_STAFF='vd_staff';
const DEFAULT_STAFF_NAMES=['范以芃','葉思宏'];
const LS_DIDI_MEDIA='vd_didi_media', LS_DIDI_SPEECH='vd_didi_speech', LS_DIDI_SOFTWARE='vd_didi_software';

let videos=[], clients=[], editors=[], archivedClients=[], archivedEditors=[], videosForStats=[], staffList=[];
let showArchivedVideos=false;
let clientStatusFilter='合作中', editorStatusFilter='合作中';
let pendingStaffField=null, pendingStaffClientName=null;
let clientProfiles={}, editorProfiles={};
let didiMedia=[], didiSpeech=[], didiSoftware=[];
let sortKey='upload_date', sortDir='asc', pendingDeleteId=null, pendingArchiveClientName=null, serverMode=false;
let clientVideoSortKey='upload_date', clientVideoSortDir='desc';

function toast(m,e){const el=document.createElement('div');el.className='toast'+(e?' error':'');el.textContent=m;document.getElementById('toastContainer').appendChild(el);setTimeout(()=>el.remove(),3000);}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):'';}
function fmtDate(d){if(!d)return'-';const p=d.split('-');return`${p[0]}/${p[1]}/${p[2]}`;}
function daysUntil(ds){if(!ds)return Infinity;const t=new Date();t.setHours(0,0,0,0);const d=new Date(ds);d.setHours(0,0,0,0);return Math.ceil((d-t)/864e5);}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtMoney(n){return n.toLocaleString('zh-TW');}
function fmtNum(n){return (parseInt(n,10)||0).toLocaleString('zh-TW');}

function statusDisplay(s){ return s==='已完成'?'客戶確認完成':(s||''); }
function statusToStep(s){
  if(s==='待分配')return 0;
  if(s==='剪輯中'||s==='初稿修改中')return 1;
  if(s==='客戶確認中'||s==='已完成')return 2;
  if(s==='已上傳雲端')return 3;
  if(s==='已上傳影片')return 4;
  return 0;
}
const STATUS_STEP_LABELS=['準備','初剪','優化','排程','上片'];
function renderStatusPipeline(status){
  const step=statusToStep(status);
  let stepsHtml='', labelsHtml='';
  for(let i=0;i<5;i++){
    if(i>0){ const connActive=step>=i; stepsHtml+='<span class="conn'+(connActive?(i===4?' active-upload':' active'):'')+'"></span>'; }
    const active=i<=step;
    const uploadClass=i===4&&active?' step-upload':'';
    stepsHtml+='<span class="step'+(active?' active':'')+uploadClass+'"></span>';
    labelsHtml+='<span>'+STATUS_STEP_LABELS[i]+'</span>';
  }
  const badgeClass='status-badge status-'+status.replace(/\s/g,'');
  return '<span class="status-pipeline-wrap" title="'+esc(statusDisplay(status))+'"><span class="status-pipeline"><span class="steps-row">'+stepsHtml+'</span><span class="labels-row">'+labelsHtml+'</span></span><span class="'+badgeClass+'">'+esc(statusDisplay(status))+'</span></span>';
}

// ── Revenue ──
function totalViews(v){
  try{ const pv=JSON.parse(v.platform_views||'[]'); if(Array.isArray(pv)&&pv.length) return pv.reduce((s,r)=>s+(parseInt(r.view_count)||0),0); }catch(e){}
  return parseInt(v.view_count)||0;
}
function igViews(v){
  try{ const pv=JSON.parse(v.platform_views||'[]'); if(!Array.isArray(pv)) return 0; return pv.filter(r=>r.platform==='IG').reduce((s,r)=>s+(parseInt(r.view_count)||0),0); }catch(e){}
  return 0;
}
function calcClientRevenue() {
  let total = 0;
  (videosForStats||videos).filter(v => v.status === '已上傳影片').forEach(v => {
    const p = getClientProfile(v.client_name);
    const budget = (p.budget_per_video || 0);
    if (budget > 0) { total += budget; return; }
    const price = CLIENT_PRICES[v.client_name];
    if (price === -1) { if (igViews(v) >= 5500) total += 5500; }
    else if (price > 0) total += price;
  });
  return total;
}

function calcDidiRevenue() {
  let media = 0, speech = 0, software = 0;
  didiMedia.forEach(r => media += (parseFloat(r.sponsor_fee) || 0));
  didiSpeech.forEach(r => speech += (parseFloat(r.speaker_fee) || 0));
  didiSoftware.forEach(r => software += (parseFloat(r.monthly_fee) || 0) * (parseInt(r.months) || 0));
  return { media, speech, software, total: media + speech + software };
}

function renderRevenue() {
  const clientRev = calcClientRevenue();
  const didiRev = calcDidiRevenue();
  const total = clientRev + didiRev.total;
  const pct = REVENUE_TARGET > 0 ? (total / REVENUE_TARGET * 100) : 0;
  const barPct = Math.min(100, pct);
  const cps = [25,50,75,90];
  const cpHtml = cps.map(cp => `<span class="rev-cp${pct>=cp?' reached':''}" style="left:${cp}%">${cp}%</span>`).join('');
  document.getElementById('revenueBar').innerHTML = `
    <div class="rev-block"><div class="rev-label">2026 年度目標</div><div class="rev-value" style="color:var(--text);font-size:17px">$${fmtMoney(REVENUE_TARGET)}</div></div>
    <div class="rev-block"><div class="rev-label">客戶影片</div><div class="rev-value" style="color:var(--info);font-size:17px">$${fmtMoney(clientRev)}</div></div>
    <div class="rev-block"><div class="rev-label">底迪收入</div><div class="rev-value" style="color:#7c3aed;font-size:17px">$${fmtMoney(didiRev.total)}</div></div>
    <div class="rev-block"><div class="rev-label">實際收入</div><div class="rev-value" style="color:var(--success);font-size:17px">$${fmtMoney(total)}</div></div>
    <div class="rev-progress-wrap">
      <div class="rev-progress-label"><span>營收進度</span><span>$${fmtMoney(total)} / $${fmtMoney(REVENUE_TARGET)}</span></div>
      <div class="rev-progress-outer">
        <div class="rev-progress-bar"><div class="rev-progress-fill" style="width:${barPct}%"></div></div>
        <div class="rev-checkpoints">${cpHtml}</div>
      </div>
    </div>
    <div class="rev-pct">${pct.toFixed(1)}%</div>`;
}

// ── Multi-select ──
function buildMultiSelect(dropId,items,countId){
  const drop=document.getElementById(dropId);
  drop.innerHTML=`<label class="ms-all"><input type="checkbox" onchange="msToggleAll('${dropId}',this.checked,'${countId}')" checked> 全選 / 取消</label>`+
    items.map(n=>`<label><input type="checkbox" value="${esc(n)}" onchange="msChanged('${dropId}','${countId}')" checked> ${esc(n)}</label>`).join('');
}
function toggleDrop(id){const d=document.getElementById(id).querySelector('.ms-drop');document.querySelectorAll('.ms-drop.open').forEach(x=>{if(x!==d)x.classList.remove('open');});d.classList.toggle('open');}
function msToggleAll(did,ch,cid){document.getElementById(did).querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.checked=ch);msChanged(did,cid);}
function msChanged(did,cid){
  const boxes=[...document.getElementById(did).querySelectorAll('input[type="checkbox"]')].filter(cb=>cb.parentElement.className!=='ms-all');
  const checked=boxes.filter(cb=>cb.checked);
  const all=document.getElementById(did).querySelector('.ms-all input');
  if(all)all.checked=checked.length===boxes.length;
  const c=document.getElementById(cid);
  if(checked.length===boxes.length||checked.length===0){c.style.display='none';}else{c.style.display='inline';c.textContent=checked.length;}
  renderTable();
}
function getSelectedValues(did){
  const boxes=[...document.getElementById(did).querySelectorAll('input[type="checkbox"]')].filter(cb=>cb.parentElement.className!=='ms-all');
  const checked=boxes.filter(cb=>cb.checked);
  if(checked.length===boxes.length)return null;
  return new Set(checked.map(cb=>cb.value));
}

// ── Storage ──
async function apiCall(path,opts={}){
  const res=await fetch(window.location.origin+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  let data; try{ data=await res.json(); }catch(e){ data=null; }
  if(res.status===401){ window.location.href=(data&&data.login_url)||'/login'; return; }
  if(!res.ok){
    const msg=(data&&data.error)?data.error:`伺服器錯誤 (${res.status})`;
    const err=new Error(msg); err.status=res.status; err.data=data; throw err;
  }
  return data||{};
}
function lsLoad(k,d){const r=localStorage.getItem(k);if(r)return JSON.parse(r);if(d){localStorage.setItem(k,JSON.stringify(d));return d;}return[];}
function lsSave(k,d){localStorage.setItem(k,JSON.stringify(d));}
function initLocalDefaults(){
  if(!localStorage.getItem(LS_CLIENTS))lsSave(LS_CLIENTS,DEFAULT_CLIENTS.map((n,i)=>({id:i+1,name:n})));
  if(!localStorage.getItem(LS_EDITORS))lsSave(LS_EDITORS,DEFAULT_EDITORS.map((n,i)=>({id:i+1,name:n})));
}

async function loadAll(){
  let ok=false;
  try{
    const b=await apiCall('/api/dashboard');
    if(b&&Array.isArray(b.videos)&&Array.isArray(b.clients)){
      videos=showArchivedVideos?(b.videos_archived||[]):b.videos;
      videosForStats=b.videos; clients=b.clients; editors=b.editors||[];
      archivedClients=b.archived_clients||[]; archivedEditors=b.archived_editors||[];
      clientProfiles=b.client_profiles||{}; editorProfiles=b.editor_profiles||{};
      staffList=b.staff||[]; didiMedia=b.didi_media||[];
      didiSpeech=b.didi_speech||[]; didiSoftware=b.didi_software||[];
      serverMode=true; ok=true;
    }
  }catch(e){console.warn('[loadAll] batch failed',e);}
  if(!ok){
    try{
      const [v,vAct,allC,e,ae,cp,ep,st,dm,ds,dw]=await Promise.all([
        apiCall(showArchivedVideos?'/api/videos?archived=1':'/api/videos'),
        showArchivedVideos?apiCall('/api/videos'):Promise.resolve(null),
        apiCall('/api/clients'),apiCall('/api/editors'),
        apiCall('/api/editors?archived=1').catch(()=>[]),
        apiCall('/api/client-profiles').catch(()=>({})),
        apiCall('/api/editor-profiles').catch(()=>({})),
        apiCall('/api/staff').catch(()=>[]),
        apiCall('/api/didi-media').catch(()=>[]),
        apiCall('/api/didi-speech').catch(()=>[]),
        apiCall('/api/didi-software').catch(()=>[]),
      ]);
      if(Array.isArray(v)&&Array.isArray(allC)){
        videos=v; videosForStats=vAct||v;
        clients=allC.filter(x=>!x.archived); archivedClients=allC.filter(x=>x.archived);
        editors=Array.isArray(e)?e:[]; archivedEditors=Array.isArray(ae)?ae:[];
        clientProfiles=(cp&&typeof cp==='object')?cp:{};
        editorProfiles=(ep&&typeof ep==='object')?ep:{};
        staffList=Array.isArray(st)?st:[]; didiMedia=Array.isArray(dm)?dm:[];
        didiSpeech=Array.isArray(ds)?ds:[]; didiSoftware=Array.isArray(dw)?dw:[];
        serverMode=true; ok=true;
      }
    }catch(e){console.warn('[loadAll] APIs failed',e);}
  }
  if(!ok){
    serverMode=false; initLocalDefaults();
    const allV=lsLoad(LS_VIDEOS,[]);videos=showArchivedVideos?allV.filter(d=>d.archived):allV.filter(d=>!d.archived);videosForStats=allV.filter(d=>!d.archived);
    const allC=lsLoad(LS_CLIENTS);clients=allC.filter(c=>!c.archived);archivedClients=allC.filter(c=>c.archived);
    const allE=lsLoad(LS_EDITORS);editors=allE.filter(e=>!e.archived);archivedEditors=allE.filter(e=>e.archived);
    clientProfiles=JSON.parse(localStorage.getItem(LS_CLIENT_PROFILES)||'{}');
    editorProfiles=JSON.parse(localStorage.getItem(LS_EDITOR_PROFILES)||'{}');
    const st=lsLoad(LS_STAFF,null);staffList=st&&st.length?st:DEFAULT_STAFF_NAMES.map((n,i)=>({id:i+1,name:n}));if(!st||!st.length)lsSave(LS_STAFF,staffList);
    didiMedia=lsLoad(LS_DIDI_MEDIA,[]);didiSpeech=lsLoad(LS_DIDI_SPEECH,[]);didiSoftware=lsLoad(LS_DIDI_SOFTWARE,[]);
  }
  populateDropdowns();
  buildMultiSelect('msStatusDrop',ALL_STATUSES,'msStatusCount');
  buildMultiSelect('msEditorDrop',editors.map(e=>e.name),'msEditorCount');
  buildMultiSelect('msClientDrop',clients.map(c=>c.name),'msClientCount');
  renderRevenue(); renderTable();
  if(ok&&serverMode) showWelcomeLoginModalIfNeeded();
}
function showWelcomeLoginModalIfNeeded(){
  if(sessionStorage.getItem('welcomeLoginShown')) return;
  sessionStorage.setItem('welcomeLoginShown','1');
  document.getElementById('welcomeLoginModal').classList.add('active');
}
function closeWelcomeLoginModal(){
  document.getElementById('welcomeLoginModal').classList.remove('active');
}

function populateDropdowns(){
  [['clientName',clients,'請選擇'],['editor',editors,'請選擇']].forEach(([id,list,ph])=>{
    const sel=document.getElementById(id);const val=sel.value;
    sel.innerHTML=`<option value="">${ph}</option>`+list.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('');
    sel.value=val;
  });
}

async function quickAddClient(){
  const name=prompt('輸入新客戶名稱：');if(!name||!name.trim())return;const n=name.trim();
  if(clients.some(c=>c.name===n)){toast('此客戶已存在',1);return;}
  try{
    if(serverMode){
      const r=await apiCall('/api/clients',{method:'POST',body:{name:n}});
      if(r.error){toast(r.error,1);return;}
      clients.push({id:r.id||(clients.length?Math.max(...clients.map(c=>c.id))+1:1),name:n});
    }else{clients.push({id:(clients.length?Math.max(...clients.map(c=>c.id))+1:1),name:n});lsSave(LS_CLIENTS,clients);}
    toast(`已新增客戶「${n}」`);
    try{await loadAll();}catch(e){console.warn('loadAll',e);}
    populateDropdowns();document.getElementById('clientName').value=n;
  }catch(e){toast(e.message||'新增客戶失敗',1);}
}

    }else{editors.push({id:(editors.length?Math.max(...editors.map(e=>e.id))+1:1),name:n});lsSave(LS_EDITORS,editors);}

// ── Stats ──
function updateStats(){
  const vs=videosForStats||videos;
  const total=vs.length,editing=vs.filter(d=>d.status==='剪輯中').length;
  const done=vs.filter(d=>['已完成','已上傳雲端','已上傳影片'].includes(d.status)).length;
  const overdue=vs.filter(d=>!DONE_STATUSES.includes(d.status)&&daysUntil(d.draft_date)<0).length;
  const urgent=vs.filter(d=>{if(DONE_STATUSES.includes(d.status))return false;const dy=daysUntil(d.draft_date);return dy>=0&&dy<=3;}).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat-card"><div class="label">全部任務</div><div class="value blue">${total}</div></div>
    <div class="stat-card"><div class="label">剪輯中</div><div class="value yellow">${editing}</div></div>
    <div class="stat-card"><div class="label">影片完成數</div><div class="value green">${done}</div></div>
    <div class="stat-card"><div class="label">即將到期（3天內）</div><div class="value" style="color:var(--warning)">${urgent}</div></div>
    <div class="stat-card"><div class="label">已逾期</div><div class="value red">${overdue}</div></div>`;

// ── Table ──
function getFiltered(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const sf=getSelectedValues('msStatusDrop'),ef=getSelectedValues('msEditorDrop'),cf=getSelectedValues('msClientDrop');
  let f=videos.filter(d=>{
    if(sf&&!sf.has(d.status))return false;if(ef&&!ef.has(d.editor))return false;if(cf&&!cf.has(d.client_name))return false;
    if(q&&![d.client_name,d.video_id,d.topic,d.editor,d.notes,d.remarks].join(' ').toLowerCase().includes(q))return false;
    return true;
  });
  f.sort((a,b)=>{
    const af=FINISHED_STATUSES.includes(a.status)?1:0,bf=FINISHED_STATUSES.includes(b.status)?1:0;
    if(af!==bf)return af-bf;
    let va=a[sortKey]||'',vb=b[sortKey]||'';
    if(sortDir==='asc')return va<vb?-1:va>vb?1:0;return va>vb?-1:va<vb?1:0;
  });
  return f;
}
function sortBy(key){if(sortKey===key)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=key;sortDir='asc';}renderTable();}

function renderTable(){
  updateStats();renderRevenue();
  document.querySelectorAll('thead th').forEach(th=>{th.classList.remove('sorted-asc','sorted-desc');if(th.dataset.key===sortKey)th.classList.add(sortDir==='asc'?'sorted-asc':'sorted-desc');});
  const filtered=getFiltered(),tb=document.getElementById('tableBody');
  if(!filtered.length){tb.innerHTML=`<tr><td colspan="8"><div class="empty-state"><div class="icon">📋</div><p>目前沒有符合條件的影片任務</p></div></td></tr>`;return;}
  tb.innerHTML=filtered.map(d=>{
    const dy=daysUntil(d.draft_date),isDone=DONE_STATUSES.includes(d.status);
    const isOD=!isDone&&dy<0,isUR=!isDone&&dy>=0&&dy<=3,isFin=FINISHED_STATUSES.includes(d.status);
    const bg=isFin?'background:#f8fafc;opacity:.65':isOD?'background:#fef2f2':isUR?'background:#fffbeb':'';
    const ds=isOD?'color:var(--danger);font-weight:600':isUR?'color:var(--warning);font-weight:600':'';
    const ot=isOD?'<span class="overdue-tag">逾期</span>':'';
    const statusPipeline=renderStatusPipeline(d.status);
    const isArchived=!!d.archived;
    const actionBtns=isArchived
      ?`<button class="btn btn-outline btn-sm" onclick="unarchiveVideo('${d.id}')">取消典藏</button><button class="btn btn-danger btn-sm" onclick="permanentDeleteVideo('${d.id}')">刪除</button>`
      :`<button class="btn btn-outline btn-sm" onclick="viewDetail('${d.id}')">查看</button><button class="btn btn-primary btn-sm" onclick="editItem('${d.id}')">編輯</button><button class="btn btn-outline btn-sm" onclick="deleteItem('${d.id}')">典藏</button>`;
    return`<tr style="${bg}"><td>${ot}<strong>${esc(d.client_name)}</strong></td><td>${esc(d.video_id)}</td><td>${esc(d.topic)}</td>
      <td>${statusPipeline}</td>
      <td style="${ds}">${fmtDate(d.draft_date)}</td><td>${fmtDate(d.upload_date)}</td>
      <td>${esc(d.editor)}</td>
      <td><div class="actions">${actionBtns}</div></td></tr>`;
  }).join('');
}

  }else{
    didiSpeech.push({id:genId(),org,date,location,topic,photo_url,feedback,speaker_fee});
  }
  saveDidiData('speech');renderDidiSpeech();renderRevenue();closeDidiSpeechModal();
}
function renderDidiSpeech(){
  const el=document.getElementById('didiSpeechSection');
  const subtotal=didiSpeech.reduce((s,r)=>s+(parseFloat(r.speaker_fee)||0),0);
  const rows=didiSpeech.map(r=>`<tr>
    <td><input type="text" value="${esc(r.org)}" onchange="onDidiSpeechChange('${r.id}','org',this.value)" style="min-width:80px"></td>
    <td><input type="date" value="${r.date||''}" onchange="onDidiSpeechChange('${r.id}','date',this.value)"></td>
    <td><input type="text" value="${esc(r.location||'')}" onchange="onDidiSpeechChange('${r.id}','location',this.value)" style="min-width:60px"></td>
    <td><input type="text" value="${esc(r.topic||'')}" onchange="onDidiSpeechChange('${r.id}','topic',this.value)" style="min-width:80px"></td>
    <td>${r.photo_url?`<a href="${esc(r.photo_url)}" target="_blank" style="font-size:12px">查看</a> `:''}
      <input type="url" value="${esc(r.photo_url||'')}" onchange="onDidiSpeechChange('${r.id}','photo_url',this.value)" placeholder="URL" style="width:80px;font-size:11px"></td>
    <td><textarea onchange="onDidiSpeechChange('${r.id}','feedback',this.value)" style="min-width:100px">${esc(r.feedback||'')}</textarea></td>
    <td><input type="number" value="${r.speaker_fee||0}" min="0" onchange="onDidiSpeechChange('${r.id}','speaker_fee',this.value)" style="width:80px"></td>
    <td><button class="btn btn-danger btn-sm" onclick="delDidiSpeech('${r.id}')">刪除</button></td>
  </tr>`).join('');
  const cards=didiSpeech.map(r=>`<div class="didi-card">
    <div class="didi-card-field"><label>單位</label><input type="text" value="${esc(r.org)}" onchange="onDidiSpeechChange('${r.id}','org',this.value)"></div>
    <div class="didi-card-field"><label>日期</label><input type="date" value="${r.date||''}" onchange="onDidiSpeechChange('${r.id}','date',this.value)"></div>
    <div class="didi-card-field"><label>地點</label><input type="text" value="${esc(r.location||'')}" onchange="onDidiSpeechChange('${r.id}','location',this.value)"></div>
    <div class="didi-card-field"><label>講題</label><input type="text" value="${esc(r.topic||'')}" onchange="onDidiSpeechChange('${r.id}','topic',this.value)"></div>
    <div class="didi-card-field"><label>照片連結</label><input type="url" value="${esc(r.photo_url||'')}" onchange="onDidiSpeechChange('${r.id}','photo_url',this.value)" placeholder="https://..."></div>
    <div class="didi-card-field"><label>反應 & 可優化</label><textarea rows="2" onchange="onDidiSpeechChange('${r.id}','feedback',this.value)">${esc(r.feedback||'')}</textarea></div>
    <div class="didi-card-field"><label>講師費</label><input type="number" value="${r.speaker_fee||0}" min="0" onchange="onDidiSpeechChange('${r.id}','speaker_fee',this.value)"></div>
    <div class="didi-card-actions"><button class="btn btn-danger btn-sm" onclick="delDidiSpeech('${r.id}')">刪除</button></div>
  </div>`).join('');
  const compactRows=didiSpeech.map(r=>`<div class="didi-compact-row">
    <span class="dm-title">${esc(r.org)||'—'}</span>
    <span class="dm-num">${fmtDate(r.date)||'—'}</span>
    <span class="dm-fee">$${fmtMoney(r.speaker_fee||0)}</span>
    <div class="dm-actions"><button class="btn btn-outline btn-sm" onclick="openDidiSpeechModal('${r.id}')">編輯</button><button class="btn btn-danger btn-sm" onclick="delDidiSpeech('${r.id}')">刪除</button></div>
  </div>`).join('');
  el.innerHTML=`<h3>演講 / 講課紀錄 <button class="btn btn-primary btn-sm" onclick="addDidiSpeech()">＋ 新增</button></h3>
    <div class="didi-table-wrap"><table class="didi-table"><thead><tr><th>單位</th><th>日期</th><th>地點</th><th>講題</th><th>照片</th><th>反應 & 可優化</th><th>講師費</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" style="text-align:center;color:var(--text2)">尚無記錄</td></tr>'}</tbody></table></div>

// ── 軟體收入 ──
function addDidiSoftware(){
  if(window.innerWidth<=768){ openDidiSoftwareModal(); return; }
  didiSoftware.push({id:genId(),client_name:'',monthly_fee:0,months:0,status:'訂閱中',start_date:''});
  saveDidiData('software');renderDidiSoftware();
}
function delDidiSoftware(id){didiSoftware=didiSoftware.filter(r=>r.id!==id);saveDidiData('software');renderDidiSoftware();}
function onDidiSoftwareChange(id,field,value){
  const r=didiSoftware.find(x=>x.id===id);if(!r)return;
  r[field]=(field==='monthly_fee'||field==='months')?parseFloat(value)||0:value;
  saveDidiData('software');renderDidiSoftware();renderRevenue();
}
function openDidiSoftwareModal(editId){
  const id=editId||'';
  document.getElementById('didiSoftwareEditId').value=id;
  document.getElementById('didiSoftwareModalTitle').textContent=id?'編輯軟體收入':'新增軟體收入';
  const opts=clients.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  document.getElementById('dswClient').innerHTML='<option value="">請選擇</option>'+opts;
  if(id){
    const r=didiSoftware.find(x=>x.id===id);if(!r)return;
    document.getElementById('dswClient').value=r.client_name||'';
    document.getElementById('dswStatus').value=r.status||'訂閱中';
    document.getElementById('dswStartDate').value=r.start_date||'';
    document.getElementById('dswMonthlyFee').value=r.monthly_fee||0;
    document.getElementById('dswMonths').value=r.months||0;
  }else{
    document.getElementById('dswClient').value='';
    document.getElementById('dswStatus').value='訂閱中';
    document.getElementById('dswStartDate').value='';
    document.getElementById('dswMonthlyFee').value=0;
    document.getElementById('dswMonths').value=0;
  }
  document.getElementById('didiSoftwareModal').classList.add('active');
}
function closeDidiSoftwareModal(){ document.getElementById('didiSoftwareModal').classList.remove('active'); }
function submitDidiSoftwareModal(){
  const id=document.getElementById('didiSoftwareEditId').value;
  const client_name=document.getElementById('dswClient').value.trim();
  const status=document.getElementById('dswStatus').value||'訂閱中';
  const start_date=document.getElementById('dswStartDate').value||'';
  const monthly_fee=parseFloat(document.getElementById('dswMonthlyFee').value)||0;
  const months=parseInt(document.getElementById('dswMonths').value,10)||0;
  if(id){
    const r=didiSoftware.find(x=>x.id===id);if(r){ r.client_name=client_name;r.status=status;r.start_date=start_date;r.monthly_fee=monthly_fee;r.months=months; }
  }else{
    didiSoftware.push({id:genId(),client_name,status,start_date,monthly_fee,months});
  }
  saveDidiData('software');renderDidiSoftware();renderRevenue();closeDidiSoftwareModal();
}
function renderDidiSoftware(){
  const el=document.getElementById('didiSoftwareSection');
  const grandTotal=didiSoftware.reduce((s,r)=>s+(parseFloat(r.monthly_fee)||0)*(parseInt(r.months)||0),0);
  const rows=didiSoftware.map(r=>{
    const sub=(parseFloat(r.monthly_fee)||0)*(parseInt(r.months)||0);
    const opts=clients.map(c=>`<option value="${esc(c.name)}"${c.name===r.client_name?' selected':''}>${esc(c.name)}</option>`).join('');
    const statusVal=r.status||'訂閱中';
    return`<tr>
    <td><select onchange="onDidiSoftwareChange('${r.id}','client_name',this.value)" style="min-width:100px">
      <option value="">請選擇</option>${opts}
    </select></td>
    <td><select onchange="onDidiSoftwareChange('${r.id}','status',this.value)" style="width:90px"><option value="訂閱中"${statusVal==='訂閱中'?' selected':''}>訂閱中</option><option value="已結束"${statusVal==='已結束'?' selected':''}>已結束</option></select></td>
    <td class="didi-sw-start-date"><input type="date" value="${esc(r.start_date||'')}" onchange="onDidiSoftwareChange('${r.id}','start_date',this.value)" style="width:100%"></td>
    <td><input type="number" value="${r.monthly_fee||0}" min="0" onchange="onDidiSoftwareChange('${r.id}','monthly_fee',this.value)" style="width:80px"></td>
    <td><input type="number" value="${r.months||0}" min="0" onchange="onDidiSoftwareChange('${r.id}','months',this.value)" style="width:60px"></td>
    <td style="font-weight:600">$${fmtMoney(sub)}</td>
    <td><button class="btn btn-danger btn-sm" onclick="delDidiSoftware('${r.id}')">刪除</button></td>
  </tr>`;
  }).join('');
  const cards=didiSoftware.map(r=>{
    const sub=(parseFloat(r.monthly_fee)||0)*(parseInt(r.months)||0);
    const opts=clients.map(c=>`<option value="${esc(c.name)}"${c.name===r.client_name?' selected':''}>${esc(c.name)}</option>`).join('');
    const statusVal=r.status||'訂閱中';
    return`<div class="didi-card">
    <div class="didi-card-field"><label>客戶名稱</label><select onchange="onDidiSoftwareChange('${r.id}','client_name',this.value)"><option value="">請選擇</option>${opts}</select></div>
    <div class="didi-card-field"><label>狀態</label><select onchange="onDidiSoftwareChange('${r.id}','status',this.value)"><option value="訂閱中"${statusVal==='訂閱中'?' selected':''}>訂閱中</option><option value="已結束"${statusVal==='已結束'?' selected':''}>已結束</option></select></div>
    <div class="didi-card-field"><label>起始日期</label><input type="date" value="${esc(r.start_date||'')}" onchange="onDidiSoftwareChange('${r.id}','start_date',this.value)"></div>
    <div class="didi-card-field"><label>月費</label><input type="number" value="${r.monthly_fee||0}" min="0" onchange="onDidiSoftwareChange('${r.id}','monthly_fee',this.value)"></div>
    <div class="didi-card-field"><label>訂購月份</label><input type="number" value="${r.months||0}" min="0" onchange="onDidiSoftwareChange('${r.id}','months',this.value)"></div>
    <div class="didi-card-field"><label>小計</label><div style="font-weight:600;padding:8px 0">$${fmtMoney(sub)}</div></div>
    <div class="didi-card-actions"><button class="btn btn-danger btn-sm" onclick="delDidiSoftware('${r.id}')">刪除</button></div>
  </div>`;
  }).join('');
  const compactRows=didiSoftware.map(r=>{
    const sub=(parseFloat(r.monthly_fee)||0)*(parseInt(r.months)||0);
    const statusVal=r.status||'訂閱中';
    return`<div class="didi-compact-row">
    <span class="dm-title">${esc(r.client_name)||'—'}</span>
    <span class="dm-status-badge" style="font-size:11px;padding:2px 6px;border-radius:4px;background:${statusVal==='訂閱中'?'#d1fae5':'#f3f4f6'};color:${statusVal==='訂閱中'?'#065f46':'#6b7280'}">${statusVal}</span>
    <span class="dm-num">${r.months||0} 月</span>
    <span class="dm-fee">$${fmtMoney(sub)}</span>
    <div class="dm-actions"><button class="btn btn-outline btn-sm" onclick="openDidiSoftwareModal('${r.id}')">編輯</button><button class="btn btn-danger btn-sm" onclick="delDidiSoftware('${r.id}')">刪除</button></div>
  </div>`;
  }).join('');
  el.innerHTML=`<h3>軟體收入 <button class="btn btn-primary btn-sm" onclick="addDidiSoftware()">＋ 新增</button></h3>
    <div class="didi-table-wrap"><table class="didi-table"><thead><tr><th>客戶名稱</th><th>狀態</th><th class="didi-sw-start-date">起始日期</th><th>月費</th><th>訂購月份</th><th>小計</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="7" style="text-align:center;color:var(--text2)">尚無記錄</td></tr>'}</tbody></table></div>
    <div class="didi-software-table-cards didi-cards">${cards||'<p style="text-align:center;color:var(--text2);padding:12px">尚無記錄</p>'}</div>
    <div class="didi-software-compact" style="display:none">${compactRows||'<p style="text-align:center;color:var(--text2);padding:12px">尚無記錄</p>'}</div>
    <div class="didi-subtotal">軟體收入小計：$${fmtMoney(grandTotal)}</div>`;
}

// ── Init ──
document.querySelectorAll('.modal-overlay').forEach(o=>{o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('active');});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.active, .confirm-overlay.active').forEach(m=>m.classList.remove('active'));});

loadAll();
</script>
