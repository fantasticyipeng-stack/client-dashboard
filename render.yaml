databases:
  - name: video-dashboard-db
    plan: free
    databaseName: dashboard
    user: dashboard_user

services:
  - type: web
    name: video-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 -c gunicorn_conf.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: video-dashboard-db
          property: connectionString
      - key: SESSION_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        value: "tolink@tolink.com.tw,yp.fan@tolink.com.tw,fantasticyipeng@gmail.com,william.sh.yeh@tolink.com.tw"
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_TARGET_ID
        sync: false
      - key: CHECK_HOUR
        value: "9"
      - key: CHECK_MINUTE
        value: "0"
      - key: SITE_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: "fantasticyipeng@gmail.com"
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "fantasticyipeng@gmail.com"
      - key: CHECKLIST_EMAIL_TO
        value: "fantasticyipeng@gmail.com"
      - key: DASHBOARD_PUBLIC_URL
        value: "https://video-dashboard-bsj9.onrender.com"
