<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小跟拍戰情版 (Demo)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f0f2f5;--card:#fff;--primary:#4f46e5;--primary-hover:#4338ca;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--sidebar-bg:#1e1b4b;--sidebar-hover:#312e81;--sidebar-active:#4f46e5;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.04);--sidebar-w:220px;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:#c7d2fe;position:fixed;top:0;left:0;bottom:0;padding:24px 0;z-index:100;}
.sidebar-title{padding:0 12px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px;}
.sidebar-title img{width:100%;max-width:180px;height:auto;display:block;}
.sidebar-nav{list-style:none;}
.sidebar-nav li{margin:2px 8px;}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;color:#c7d2fe;text-decoration:none;font-size:14px;font-weight:500;}
.sidebar-nav a.active{background:var(--sidebar-active);color:#fff;}
.main-content{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
.header{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.header h1{font-size:19px;font-weight:700;}
.revenue-bar{background:var(--card);margin:16px 24px 0;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.rev-block{text-align:center;}
.rev-block .rev-label{font-size:11px;color:var(--text2);margin-bottom:2px;}
.rev-block .rev-value{font-size:20px;font-weight:700;}
.rev-progress-wrap{flex:1;min-width:180px;}
.rev-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px;}
.rev-progress-bar{height:14px;background:#e2e8f0;border-radius:7px;overflow:hidden;}
.rev-progress-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--primary),#7c3aed);transition:width .5s ease;}
.rev-pct{font-size:20px;font-weight:700;color:var(--primary);min-width:55px;text-align:center;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:16px 24px;}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);}
.stat-card .label{font-size:12px;color:var(--text2);margin-bottom:2px;}
.stat-card .value{font-size:24px;font-weight:700;}
.table-wrapper{padding:0 24px 24px;}
.table-container{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:600px;}
thead th{text-align:left;padding:8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);background:#f8fafc;border-bottom:1px solid var(--border);}
tbody td{padding:7px 6px;border-bottom:1px solid var(--border);font-size:13px;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text2);}
.empty-state .icon{font-size:40px;margin-bottom:8px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn-white{background:#fff;color:var(--primary);}
.btn-white:hover{background:#f1f0ff;}
.toast-container{position:fixed;top:18px;right:18px;z-index:2000;}
.toast{background:var(--card);padding:11px 16px;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.12);font-size:13px;animation:slideIn .3s ease;border-left:4px solid var(--warning);}
@keyframes slideIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
.demo-badge{display:inline-block;background:var(--warning);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}
@media (max-width:900px){.sidebar{width:56px;}.sidebar-title img{display:none;}.sidebar-nav span{display:none;}.main-content{margin-left:56px;}}
@media (max-width:768px){.sidebar{display:none;}.main-content{margin-left:0;}.revenue-bar{flex-direction:column;}.stats{overflow-x:auto;flex-wrap:nowrap;}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-title"><img src="/logo.png" alt="小跟拍"></div>
  <ul class="sidebar-nav">
    <li><a class="active"><span>&#9776;</span><span>影片管理</span></a></li>
  </ul>
</aside>

<div class="main-content">
  <header class="header">
    <h1>小跟拍戰情版 <span class="demo-badge">Demo</span></h1>
    <div class="header-right">
      <a href="/unlock" class="btn btn-white" style="text-decoration:none">離開 Demo</a>
      <button type="button" class="btn btn-white" onclick="demoToast()">＋ 新增影片任務</button>
    </div>
  </header>

  <section class="revenue-bar" id="revenueBar"></section>

  <section class="stats" id="stats"></section>

  <section class="table-wrapper">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>客戶名稱</th>
            <th>影片編號</th>
            <th>影片主題</th>
            <th>初稿日</th>
            <th>上片日</th>
            <th>剪輯</th>
            <th>狀態</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7"><div class="empty-state"><span class="icon">📋</span><p>目前沒有影片任務（Demo 模式不儲存任何記錄）</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const REVENUE_TARGET = 10000000; // 1000 萬
const total = 0, clientRev = 0, didiRev = 0;

function fmtMoney(n) { return (n || 0).toLocaleString('zh-TW'); }

function renderRevenue() {
  const pct = REVENUE_TARGET > 0 ? (total / REVENUE_TARGET * 100) : 0;
  const barPct = Math.min(100, pct);
  document.getElementById('revenueBar').innerHTML = `
    <div class="rev-block"><div class="rev-label">2026 年度目標</div><div class="rev-value" style="color:var(--text)">$${fmtMoney(REVENUE_TARGET)}</div></div>
    <div class="rev-block"><div class="rev-label">客戶影片</div><div class="rev-value" style="color:var(--info)">$0</div></div>
    <div class="rev-block"><div class="rev-label">底迪收入</div><div class="rev-value" style="color:#7c3aed">$0</div></div>
    <div class="rev-block"><div class="rev-label">實際收入</div><div class="rev-value" style="color:var(--success)">$0</div></div>
    <div class="rev-progress-wrap">
      <div class="rev-progress-label"><span>營收進度</span><span>$0 / $${fmtMoney(REVENUE_TARGET)}</span></div>
      <div class="rev-progress-bar"><div class="rev-progress-fill" style="width:${barPct}%"></div></div>
    </div>
    <div class="rev-pct">0%</div>`;
}

function renderStats() {
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">總任務數</div><div class="value">0</div></div>
    <div class="stat-card"><div class="label">剪輯中</div><div class="value">0</div></div>
    <div class="stat-card"><div class="label">已完成 / 已上傳</div><div class="value">0</div></div>`;
}

function demoToast() {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = 'Demo 模式，操作不會儲存';
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(function() { el.remove(); }, 3000);
}

renderRevenue();
renderStats();
</script>
</body>
</html>
